# Yerel geliştirme yığını. Çalıştırma: docker compose up --build
# Değerler .env dosyasından gelir (.env.example'ı kopyalayın). Eksik değişkende compose hemen hata verir.

# Java servislerinin ortak ayarları (YAML anchor); her servis yalnızca farklı olanı yazar
x-java-servis: &java-servis
  restart: unless-stopped
  networks: [sinema-ag]
  depends_on:
    mysql:
      condition: service_healthy
  deploy:
    resources:
      limits:
        memory: 512m
  # Doğrulayan servislere YALNIZCA public key dosyası verilir (private key yok); auth bunu kendi volumes'üyle ezer
  volumes:
    - ${JWT_KEYS_DIR:-./keys}/jwt-public.pem:/run/secrets/jwt/jwt-public.pem:ro

services:
  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD .env içinde tanımlı olmalı}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD .env içinde tanımlı olmalı}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?CATALOG_DB_PASSWORD .env içinde tanımlı olmalı}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?BOOKING_DB_PASSWORD .env içinde tanımlı olmalı}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?PAYMENT_DB_PASSWORD .env içinde tanımlı olmalı}
      TZ: UTC
    command: ["--default-time-zone=+00:00"]
    volumes:
      - mysql-veri:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    # Yalnızca bu bilgisayardan erişim: IDE'de çalışan servisler için (planlama §6.5)
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    networks: [sinema-ag]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  auth-service:
    <<: *java-servis
    build:
      context: .
      args: { SERVIS: auth-service }
    image: sinema/auth-service:dev
    environment:
      DB_HOST: mysql
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_KEYS_DIR: /run/secrets/jwt
      # Boşsa ilk admin oluşturulmaz; doluysa yalnızca sistemde hiç admin yokken bir kez oluşturulur
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Servis token'ı isteyen servislerin sırları; boş olan istemci devre dışıdır
      BOOKING_SERVICE_CLIENT_SECRET: ${BOOKING_SERVICE_CLIENT_SECRET:-}
      PAYMENT_SERVICE_CLIENT_SECRET: ${PAYMENT_SERVICE_CLIENT_SECRET:-}
    # Private key yalnızca auth'a verilir (token imzalayan tek servis); salt okunur
    volumes:
      - ${JWT_KEYS_DIR:-./keys}:/run/secrets/jwt:ro
    healthcheck: &saglik
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  catalog-service:
    <<: *java-servis
    build:
      context: .
      args: { SERVIS: catalog-service }
    image: sinema/catalog-service:dev
    environment:
      DB_HOST: mysql
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      JWT_KEYS_DIR: /run/secrets/jwt
      # Boşsa TMDB araması 503 verir, elle film girişi çalışır (K18)
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
      # dev: katalog boşsa örnek veri yüklenir (3 şube, 10 salon, filmler, 7 günlük seans; K42)
      SPRING_PROFILES_ACTIVE: ${CATALOG_PROFILES:-dev}
    healthcheck:
      <<: *saglik
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]

  booking-service:
    <<: *java-servis
    build:
      context: .
      args: { SERVIS: booking-service }
    image: sinema/booking-service:dev
    environment:
      DB_HOST: mysql
      DB_PASSWORD: ${BOOKING_DB_PASSWORD}
      JWT_KEYS_DIR: /run/secrets/jwt
      AUTH_SERVICE_URL: http://auth-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      BOOKING_SERVICE_CLIENT_SECRET: ${BOOKING_SERVICE_CLIENT_SECRET}
    healthcheck:
      <<: *saglik
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]

  payment-service:
    <<: *java-servis
    build:
      context: .
      args: { SERVIS: payment-service }
    image: sinema/payment-service:dev
    environment:
      DB_HOST: mysql
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      JWT_KEYS_DIR: /run/secrets/jwt
    healthcheck:
      <<: *saglik
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]

  redis:
    image: redis:8.8.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD .env içinde tanımlı olmalı}
    # Parola komut satırına compose değil container kabuğu koyar; yalnızca rate limit sayacı olduğu için kalıcılık kapalı
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no"]
    networks: [sinema-ag]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-gateway:
    build:
      context: .
      args: { SERVIS: api-gateway }
    image: sinema/api-gateway:dev
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_KEYS_DIR: /run/secrets/jwt
      # Servislere Docker DNS adıyla gidilir (planlama §6.2, servis keşfi yok)
      AUTH_SERVICE_URL: http://auth-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    volumes:
      - ${JWT_KEYS_DIR:-./keys}/jwt-public.pem:/run/secrets/jwt/jwt-public.pem:ro
    # Dışarıya açılan tek API giriş noktası (planlama §6.2); geliştirmede yalnızca bu bilgisayardan erişilir
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8080}:8080"
    networks: [sinema-ag]
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      <<: *saglik
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/liveness"]

networks:
  sinema-ag:

volumes:
  mysql-veri:
