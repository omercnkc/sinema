<header>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark header" aria-label="Ana menü">
    <div class="container">
      <a class="navbar-brand header__marka" routerLink="/" (click)="menuyuKapat()">Sinema</a>

      <button
        type="button"
        class="navbar-toggler"
        aria-controls="ana-menu"
        [attr.aria-expanded]="!menuKapali"
        aria-label="Menüyü aç/kapat"
        (click)="menuyuDegistir()"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div id="ana-menu" class="collapse navbar-collapse" [ngbCollapse]="menuKapali">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <!-- Angular 13'te ariaCurrentWhenActive yok (15'te geldi): aria-current isActive'ten -->
            <a
              #filmlerBaglantisi="routerLinkActive"
              class="nav-link"
              routerLink="/filmler"
              routerLinkActive="active"
              [attr.aria-current]="filmlerBaglantisi.isActive ? 'page' : null"
              (click)="menuyuKapat()"
              >Filmler</a
            >
          </li>
          <li class="nav-item" *ngIf="yonetici$ | async">
            <a
              #yonetimBaglantisi="routerLinkActive"
              class="nav-link"
              routerLink="/admin"
              routerLinkActive="active"
              [attr.aria-current]="yonetimBaglantisi.isActive ? 'page' : null"
              (click)="menuyuKapat()"
              >Yönetim</a
            >
          </li>
        </ul>
        <div class="header__oturum" data-test="oturum-alani">
          <ng-container *ngIf="kullanici$ | async as kullanici; else misafir">
            <div ngbDropdown display="dynamic" placement="bottom-end">
              <button type="button" class="btn btn-outline-light btn-sm" id="kullanici-menusu" ngbDropdownToggle>
                {{ kullanici.firstName || kullanici.email }}
              </button>
              <div ngbDropdownMenu aria-labelledby="kullanici-menusu">
                <span class="dropdown-item-text small text-muted">{{ kullanici.email }}</span>
                <div class="dropdown-divider"></div>
                <a ngbDropdownItem routerLink="/rezervasyonlarim" (click)="menuyuKapat()">Rezervasyonlarım</a>
                <div class="dropdown-divider"></div>
                <button type="button" ngbDropdownItem (click)="cikisYap()">Çıkış yap</button>
              </div>
            </div>
          </ng-container>
          <ng-template #misafir>
            <a class="btn btn-link link-light btn-sm" routerLink="/giris" (click)="menuyuKapat()">Giriş yap</a>
            <a class="btn btn-primary btn-sm" routerLink="/kayit" (click)="menuyuKapat()">Kayıt ol</a>
          </ng-template>
        </div>
      </div>
    </div>
  </nav>
</header>
