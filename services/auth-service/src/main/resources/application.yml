spring:
  application:
    name: auth-service
  datasource:
    # Servis yalnızca kendi şemasına, kendi kullanıcısıyla bağlanır (planlama §6.3). Parolanın varsayılanı yok: eksikse açılmaz.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/auth_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME:auth_user}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Şemayı yalnızca Flyway değiştirir; Hibernate sadece entity'lerin şemayla uyumunu kontrol eder
      ddl-auto: validate

server:
  port: ${SERVER_PORT:8081}

sinema:
  guvenlik:
    jwt:
      yayinci: sinema-auth
      acik-anahtar: file:${JWT_KEYS_DIR:./keys}/jwt-public.pem
    # Token'sız erişilen uçlar; refresh/logout JWT yerine cookie ile, service-token clientSecret ile çalışır
    acik-yollar:
      - POST /api/v1/auth/register
      - POST /api/v1/auth/login
      - POST /api/v1/auth/refresh
      - POST /api/v1/auth/logout
      - POST /internal/v1/auth/service-token
  auth:
    # BCrypt iş faktörü (planlama §5.6); 12 ≈ parola başına ~250 ms, kaba kuvveti pahalılaştırır
    bcrypt-maliyeti: 12
    jwt:
      erisim-token-suresi: 15m
      servis-token-suresi: 5m
      # scripts/jwt-anahtar-uret.sh ile üretilir; Docker'da salt okunur mount edilen klasör
      ozel-anahtar: file:${JWT_KEYS_DIR:./keys}/jwt-private.pem
    # Servis token'ı alabilen servisler ve gidebilecekleri hedefler (tek yönlü bağımlılık: payment → booking → catalog)
    servis-istemcileri:
      booking-service:
        sir: ${BOOKING_SERVICE_CLIENT_SECRET:}
        izinli-hedefler: [catalog-service]
      payment-service:
        sir: ${PAYMENT_SERVICE_CLIENT_SECRET:}
        izinli-hedefler: [booking-service]
    kilit:
      esik: 5
      sure: 5m
    yenileme:
      sure: 14d
      tolerans: 10s
      cerez-adi: sinema_refresh
      cerez-yolu: /api/v1/auth
      # Tarayıcılar http://localhost'u güvenli sayar, bu yüzden geliştirmede de açık kalabilir
      guvenli-cerez: ${COOKIE_SECURE:true}
      temizlik-zamani: "0 30 3 * * *"
    ilk-admin:
      email: ${ADMIN_EMAIL:}
      parola: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  pattern:
    # Her log satırına korelasyon kimliği eklenir (sinema-common filtresi MDC'ye yazar)
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
