spring:
  application:
    name: auth-service
  datasource:
    # Servis yalnızca kendi şemasına, kendi kullanıcısıyla bağlanır (planlama §6.3). Parolanın varsayılanı yok: eksikse açılmaz.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/auth_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME:auth_user}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Şemayı yalnızca Flyway değiştirir; Hibernate sadece entity'lerin şemayla uyumunu kontrol eder
      ddl-auto: validate

server:
  port: ${SERVER_PORT:8081}

sinema:
  auth:
    # BCrypt iş faktörü (planlama §5.6); 12 ≈ parola başına ~250 ms, kaba kuvveti pahalılaştırır
    bcrypt-maliyeti: 12
    jwt:
      yayinci: sinema-auth
      erisim-token-suresi: 15m
      # scripts/jwt-anahtar-uret.sh ile üretilir; Docker'da salt okunur mount edilen klasör
      ozel-anahtar: file:${JWT_KEYS_DIR:./keys}/jwt-private.pem
      acik-anahtar: file:${JWT_KEYS_DIR:./keys}/jwt-public.pem
    kilit:
      esik: 5
      sure: 5m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  pattern:
    # Her log satırına korelasyon kimliği eklenir (sinema-common filtresi MDC'ye yazar)
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
