spring:
  application:
    name: booking-service
  datasource:
    # Servis yalnızca kendi şemasına, kendi kullanıcısıyla bağlanır (planlama §6.3). Parolanın varsayılanı yok: eksikse açılmaz.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/booking_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME:booking_user}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Şemayı yalnızca Flyway değiştirir; Hibernate sadece entity'lerin şemayla uyumunu kontrol eder
      ddl-auto: validate
  cloud:
    openfeign:
      # Feign çağrıları devre kesiciden geçer; başarısızlıkta istemcinin fallbackFactory'si çalışır
      circuitbreaker:
        enabled: true
    circuitbreaker:
      resilience4j:
        # Çağrı aynı thread'de kalsın (MDC'deki korelasyon kimliği taşınsın); zaman sınırı Feign'in okuma zaman aşımı
        disable-thread-pool: true
        disable-time-limiter: true

server:
  port: ${SERVER_PORT:8083}

sinema:
  booking:
    # K11: koltuk tutma süresi; satış kapanışını aşamaz
    hold-suresi: 3m
    # K24: bir işlemde en çok koltuk
    en-fazla-koltuk: 5
    # K32: ödeme başlatılınca hold bir kez bu kadar uzar
    odeme-penceresi: 2m
    # K29/K33: son 30 dk'da 3 terk → son terkten 10 dk sonrasına kadar yeni hold yok
    terk-korumasi:
      esik: 3
      pencere: 30m
      bekleme: 10m
    # K47: seat-status cevabı seans başına en çok bu kadar bellekte tutulur
    doluluk-onbellek-suresi: 2s
    # Süresi dolan hold'ları kapatan job (koltuk zaten sorgu anında boş sayılır; bu yalnızca düzenleme)
    sure-dolumu:
      aralik: 1m
      parti-boyutu: 500
  guvenlik:
    jwt:
      yayinci: sinema-auth
      acik-anahtar: file:${JWT_KEYS_DIR:./keys}/jwt-public.pem
    # Misafir koltuk doluluğunu görür (K3, K40); QR bilet doğrulama herkese açık (K30)
    acik-yollar:
      - GET /api/v1/bookings/showtimes/*/seat-status
      - GET /api/v1/tickets/*
  # Servis token'ı (auth) + Feign altyapısı: sinema-common SinemaServisIstemcisiOtomatikYapilandirma
  servis-istemcisi:
    auth-adresi: ${AUTH_SERVICE_URL:http://localhost:8081}
    # Varsayılanı yok: eksikse servis açılmaz (fail fast)
    sir: ${BOOKING_SERVICE_CLIENT_SECRET}
  servisler:
    catalog-adresi: ${CATALOG_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  pattern:
    # Her log satırına korelasyon kimliği eklenir (sinema-common filtresi MDC'ye yazar)
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
