spring:
  application:
    name: catalog-service

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  pattern:
    # Her log satırına korelasyon kimliği eklenir (sinema-common filtresi MDC'ye yazar)
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
