spring:
  application:
    name: catalog-service
  datasource:
    # Servis yalnızca kendi şemasına, kendi kullanıcısıyla bağlanır (planlama §6.3). Parolanın varsayılanı yok: eksikse açılmaz.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/catalog_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME:catalog_user}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Şemayı yalnızca Flyway değiştirir; Hibernate sadece entity'lerin şemayla uyumunu kontrol eder
      ddl-auto: validate

server:
  port: ${SERVER_PORT:8082}

sinema:
  guvenlik:
    jwt:
      yayinci: sinema-auth
      acik-anahtar: file:${JWT_KEYS_DIR:./keys}/jwt-public.pem
    # Misafir (token'sız) katalogu görüntüler (K3); listede olmayan her şey token ister
    acik-yollar:
      - GET /api/v1/catalog/**
  katalog:
    # K26: seans bitişi = başlangıç + film süresi + bu pay
    seans-arasi-payi: 15m
    # K10: satış seans başladıktan 10 dk sonra kapanır (negatif = başlamadan önce)
    varsayilan-satis-kapanis-ofseti: 10m
    is-saat-dilimi: Europe/Istanbul
  tmdb:
    taban-adres: https://api.themoviedb.org/3
    # Boşsa TMDB araması 503 verir, elle film girişi çalışır
    token: ${TMDB_API_TOKEN:}
    dil: tr-TR
    bolge: TR
    baglanti-zaman-asimi: 2s
    okuma-zaman-asimi: 5s
    oyuncu-siniri: 20
    # K45: TMDB şartları en çok 6 ay saklamaya izin verir; biz 3 ayda bir yenileriz
    tazelik-suresi: 90d
    # Her ayın 1'i 04:00 (UTC)
    yenileme-zamanlamasi: "0 0 4 1 * *"
    yenileme-paketi: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  pattern:
    # Her log satırına korelasyon kimliği eklenir (sinema-common filtresi MDC'ye yazar)
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
