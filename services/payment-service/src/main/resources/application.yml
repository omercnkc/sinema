spring:
  application:
    name: payment-service
  datasource:
    # Servis yalnızca kendi şemasına, kendi kullanıcısıyla bağlanır (planlama §6.3). Parolanın varsayılanı yok: eksikse açılmaz.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/payment_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME:payment_user}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Şemayı yalnızca Flyway değiştirir; Hibernate sadece entity'lerin şemayla uyumunu kontrol eder
      ddl-auto: validate
  cloud:
    openfeign:
      # Feign çağrıları devre kesiciden geçer; başarısızlıkta istemcinin fallbackFactory'si çalışır
      circuitbreaker:
        enabled: true
    circuitbreaker:
      resilience4j:
        # Çağrı aynı thread'de kalsın (MDC'deki korelasyon kimliği taşınsın); zaman sınırı Feign'in okuma zaman aşımı
        disable-thread-pool: true
        disable-time-limiter: true

server:
  port: ${SERVER_PORT:8084}

sinema:
  payment:
    # K49: IYZICO (varsayılan, sandbox) ya da MOCK (anahtarsız yerel deneme, sahte ödeme sayfası)
    saglayici: ${PAYMENT_PROVIDER:IYZICO}
    # Sağlayıcı ödeme sonrası tarayıcıyı buraya yönlendirir (gateway üzerinden, K39)
    callback-adresi: ${PAYMENT_CALLBACK_URL:http://localhost:8080/api/v1/payments/callback/iyzico}
    # Callback işlenince tarayıcının gittiği ön yüz sayfası (?reservationId= eklenir)
    sonuc-adresi: ${PAYMENT_RESULT_URL:http://localhost:4200/odeme/sonuc}
    # K48: toplanmayan ama iyzico'nun zorunlu tuttuğu alanlar (yalnızca sandbox) ve kişi bilgisi olmayan hesaplar için yedekler
    alici:
      kimlik-no: "11111111111"
      adres: "Kadıköy, İstanbul"
      sehir: Istanbul
      ulke: Turkey
      yedek-ad: Sinema
      yedek-soyad: Musterisi
      yedek-telefon: "+905350000000"
    # Yalnızca saglayici=IYZICO iken; anahtarların varsayılanı yok (eksikse servis açılmaz). Yalnızca sandbox (K39)
    iyzico:
      api-anahtari: ${IYZICO_API_KEY:}
      gizli-anahtar: ${IYZICO_SECRET_KEY:}
      taban-adres: ${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}
    mock:
      # Sahte ödeme sayfası (gateway üzerinden); yalnızca saglayici=MOCK iken
      sayfa-adresi: ${PAYMENT_MOCK_PAGE_URL:http://localhost:8080/api/v1/payments/mock/checkout}
  # Servis token'ı (auth) + Feign altyapısı: sinema-common SinemaServisIstemcisiOtomatikYapilandirma
  servis-istemcisi:
    auth-adresi: ${AUTH_SERVICE_URL:http://localhost:8081}
    # Varsayılanı yok: eksikse servis açılmaz (fail fast)
    sir: ${PAYMENT_SERVICE_CLIENT_SECRET}
  servisler:
    booking-adresi: ${BOOKING_SERVICE_URL:http://localhost:8083}
  guvenlik:
    jwt:
      yayinci: sinema-auth
      acik-anahtar: file:${JWT_KEYS_DIR:./keys}/jwt-public.pem
    # iyzico ödeme sonrası tarayıcıyı buraya form POST'uyla yönlendirir; JWT taşımaz, sonuç retrieve ile doğrulanır (K39)
    acik-yollar:
      - POST /api/v1/payments/callback/iyzico
      # Sahte ödeme sayfası (K49): tarayıcı yönlendirmesi, giriş yok; yalnızca MOCK seçiliyken uç vardır, yoksa 404
      - GET /api/v1/payments/mock/checkout/*
      - POST /api/v1/payments/mock/checkout/*/complete

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  pattern:
    # Her log satırına korelasyon kimliği eklenir (sinema-common filtresi MDC'ye yazar)
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
